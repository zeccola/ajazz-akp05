# Shows a live sensor value on a button ("text monitor"). One automation
# per value you want on the panel: trigger on the sensor's state, write
# the formatted value into that button's "Button N Text" entity with
# text.set_value, and the add-on renders it (Roboto, auto-shrunk).
#
# No special add-on topics involved -- this is just the standard
# text.set_value action on a normal text entity, so it also works from
# scripts, the Developer Tools "Actions" tab, or any other automation.
# (Earlier versions routed this through a "Follow Entity" field plus an
# akp05/entity_update topic; both were removed in 0.10.0 -- this direct
# form is simpler and does the same thing.)
#
# The startup trigger re-pushes the current value after a Home Assistant
# restart, since the panel only ever shows what it was last told.
alias: Ajazz button 7 shows bedroom temperature
description: Keeps Button 7's text in sync with sensor.bedroom_temperature
triggers:
  - trigger: state
    entity_id: sensor.bedroom_temperature
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - action: text.set_value
    target:
      entity_id: text.ajazz_akp05_button_7_text
    data:
      value: >-
        {{ states('sensor.bedroom_temperature') }}{{ state_attr('sensor.bedroom_temperature', 'unit_of_measurement') | default('') }}
mode: queued

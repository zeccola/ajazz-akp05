name: "AKP05 Bridge"
version: "0.10.3"
slug: "akp05_bridge"
description: >-
  USB bridge for the Ajazz AKP05 macro pad. Owns the raw HID connection
  (the only thing on the HA OS host that can) and exposes it to Home
  Assistant purely via MQTT discovery -- buttons/encoders as event
  entities, brightness as a light entity, a display on/off switch,
  per-button icon/text entities, no separate integration to install.
url: "https://github.com/zeccola/ajazz-akp05"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
usb: true
udev: true
services:
  - mqtt:want
options:
  discovery_prefix: "homeassistant"
  strip_refresh_seconds: 30
  legacy_wake_sequence: false
schema:
  discovery_prefix: "str"
  strip_refresh_seconds: "int(5,)?"
  legacy_wake_sequence: "bool?"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"

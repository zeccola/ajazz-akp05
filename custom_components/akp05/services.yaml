set_button_icon:
  name: Set button icon
  description: Render a Material Design Icon on one of the AKP05's buttons, colored by on/off state.
  fields:
    button:
      name: Button
      description: Button number (1-10).
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    icon:
      name: Icon
      description: Any Material Design Icons name, e.g. "floor-lamp-outline" or "mdi:floor-lamp-outline".
      required: true
      selector:
        text:
    state:
      name: State
      description: Colors the icon green (on) or red (off); gray if omitted.
      required: false
      selector:
        select:
          options:
            - "on"
            - "off"

set_button_image:
  name: Set button image
  description: Upload a custom image to one of the AKP05's buttons.
  fields:
    button:
      name: Button
      description: Button number (1-10).
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    image_b64:
      name: Image (base64)
      description: Base64-encoded PNG/JPEG image data.
      required: true
      selector:
        text:

clear_button:
  name: Clear button
  description: Blank a single AKP05 button.
  fields:
    button:
      name: Button
      description: Button number (1-10).
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box

clear_all:
  name: Clear all
  description: Dim the panel to 0% and wipe every button/strip image to black. Destructive -- images must be re-uploaded afterward.
